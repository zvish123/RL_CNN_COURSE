<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>אבטחת מידע בפרויקט הגמר | י״ב סייבר</title><style>
:root{--bg:#081225;--panel:#111f37;--panel2:#172945;--text:#f0f6ff;--muted:#afc2da;--accent:#53e0c0;--blue:#77baff;--warn:#ffc46b;--bad:#ff8d99;--line:#324763}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0%,#193453,#081225 48%);color:var(--text);font:18px/1.65 Arial,'Segoe UI',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1190px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.brand{font-weight:800;color:var(--accent);letter-spacing:.4px}.pill{border:1px solid var(--line);border-radius:30px;padding:5px 14px;color:var(--muted);font-size:14px}.progress{height:5px;background:#263a54;border-radius:5px;margin:17px 0 25px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));transition:width .25s}.slide{display:none;min-height:570px;animation:fade .25s ease}.slide.active{display:block}@keyframes fade{from{opacity:.3;transform:translateY(9px)}to{opacity:1;transform:none}}h1{font-size:clamp(36px,5vw,66px);line-height:1.18;margin:12px 0 22px}h2{font-size:clamp(27px,3.2vw,42px);line-height:1.25;margin:8px 0 18px}h3{margin:0 0 8px;font-size:21px}p{margin:8px 0 15px}.lead{font-size:23px;color:var(--muted);max-width:850px}.eyebrow{color:var(--accent);font-size:15px;font-weight:800;letter-spacing:.5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(150deg,var(--panel),#0e1b30);border:1px solid var(--line);border-radius:17px;padding:22px}.card p,.card li{color:var(--muted)}.card strong{color:white}.card.danger{border-right:4px solid var(--bad)}.card.safe{border-right:4px solid var(--accent)}.card.test{border-right:4px solid var(--blue)}.tag{display:inline-block;border-radius:30px;background:#233b57;color:var(--blue);padding:3px 11px;font-size:13px;font-weight:bold;margin:4px 0 12px}.tag.req{color:var(--accent)}.tag.advanced{color:var(--warn)}ul{padding-right:23px;margin:8px 0}li{margin:5px 0}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}.btn{border:1px solid #45617e;border-radius:10px;background:#203a58;color:#fff;padding:10px 19px;font-weight:700}.btn:hover{background:#315474}.btn.primary{background:#176b69;border-color:#259c93}.btn:disabled{opacity:.3;cursor:default}.count{font-size:15px;color:var(--muted)}.hint{color:var(--warn);font-size:15px}.code{direction:ltr;text-align:left;white-space:pre-wrap;overflow:auto;background:#050d19;border:1px solid #2b4965;border-radius:13px;padding:18px;color:#b5f1db;font:15px/1.65 Consolas,monospace}.reveal{display:none;margin-top:13px;padding:16px;border:1px solid #36746c;background:#123732;border-radius:12px}.reveal.show{display:block}.choice{display:block;width:100%;text-align:right;background:#192d49;color:white;border:1px solid #3a5877;padding:12px 16px;border-radius:10px;margin:8px 0}.choice:hover{background:#284664}.choice.good{border-color:var(--accent);background:#17463d}.choice.wrong{border-color:var(--bad);background:#4c2636}.mini{font-size:14px;color:var(--muted)}.checkrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #29405a}.checkrow input{accent-color:var(--accent);width:19px;height:19px}.summary{background:#132c3e;border:1px solid #376b72;border-radius:13px;padding:15px;margin-top:14px}.hero{padding-top:70px}.hero-mark{font-size:70px}.num{font-size:48px;font-weight:900;color:var(--accent)}.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flow span{padding:10px 16px;background:#1b3853;border-radius:10px}.flow b{color:var(--accent)}.smallbtn{font-size:14px;padding:6px 11px}.footer-note{color:#8ca7c4;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.answer{min-height:27px;color:var(--accent);font-weight:700}.warning{color:var(--warn)}@media(max-width:740px){.shell{padding:12px}.slide{min-height:650px}.grid,.grid3,.two{grid-template-columns:1fr}.card{padding:15px}.hero{padding-top:35px}body{font-size:16px}}
 .reveal .code{max-height:470px;overflow:auto;white-space:pre;tab-size:4}.reveal .mini{margin-bottom:10px}.card .card{padding:15px;background:#152940} </style></head><body><div class="shell"><header class="top"><div class="brand">CYBER LAB / כיתה י״ב</div><div class="pill">פרויקט גמר • אבטחת מידע • למידה פעילה</div><button class="btn smallbtn" onclick="showIndex()">☷ תוכן עניינים</button></header><div class="progress"><div id="bar"></div></div><main id="slides"></main><nav class="controls"><button class="btn primary" id="next" onclick="move(1)">הבא ←</button><span class="count" id="count"></span><button class="btn" id="prev" onclick="move(-1)">→ הקודם</button></nav><p class="footer-note">ניווט: מקשי החצים או הכפתורים. הדגמות תקיפה מיועדות לסביבה מקומית ומורשית בלבד.</p></div><script>
const topics=[
{title:'הצפנת תקשורת | TLS',level:'חובה בתקשורת',threat:'האזנה לרשת או תוקף באמצע הדרך (MITM) עלולים לחשוף הודעות, סיסמאות ומידע אישי.',scenario:'לקוח שולח LOGIN עם סיסמה דרך TCP רגיל. מי שלוכד את התעבורה יכול לקרוא אותה.',defense:'HTTPS/TLS או ssl.SSLContext ב-TCP. חובה לאמת את תעודת השרת ואת שם השרת; לא לבטל אימות תעודות.',implementation:'להפעיל שרת TLS, לחבר לקוח שמאמת תעודה, להעביר את כל המידע הרגיש בערוץ המוצפן.',test:'ללכוד תעבורה ב-Wireshark: התוכן לא קריא; חיבור עם תעודה לא מהימנה נדחה.',code:`import ssl\n\ncontext = ssl.create_default_context()\nwith context.wrap_socket(sock, server_hostname="localhost") as secure_sock:\n    secure_sock.sendall(b"hello")`,note:'דוגמה חלקית: sock חייב להיות Socket מחובר; יש להגדיר תעודה מהימנה בסביבת הפיתוח.'},
{title:'סיסמאות | Hashing + Salt',level:'חובה במערכת משתמשים',threat:'דליפת בסיס הנתונים חושפת סיסמאות אם נשמרו בטקסט גלוי או בגיבוב מהיר כמו SHA-256 ללא מנגנון סיסמאות.',scenario:'שני משתמשים בוחרים אותה סיסמה. ללא Salt ייחודי, ערכי הגיבוב שלהם עשויים להיות זהים.',defense:'Argon2id עם Salt אקראי וייחודי. Hash אינו הצפנה הפיכה. Pepper הוא סוד נוסף הנשמר בנפרד מבסיס הנתונים.',implementation:'לשמור רק גיבוב סיסמה, לאמת באמצעות verify, לא לרשום סיסמאות ללוג; להגדיר מדיניות סיסמאות.',test:'אותה סיסמה בשני חשבונות מפיקה גיבובים שונים; סיסמה שגויה נדחית.',code:`from argon2 import PasswordHasher\nph = PasswordHasher()\nstored = ph.hash("example-password")\nassert ph.verify(stored, "example-password")`,note:'Pepper הוא הרחבה: יש לתכנן ניהול סוד נפרד ורוטציה, ולא לשמור אותו באותה טבלה.'},
{title:'SQL Injection',level:'חובה עם בסיס נתונים',threat:'קלט משתמש שמשורשר ישירות ל-SQL עלול לשנות שאילתה, לעקוף אימות או לקרוא נתונים.',scenario:`שאילתה שנבנתה בחיבור מחרוזות: SELECT * FROM users WHERE name='${"' OR '1'='1"}'`,defense:'להשתמש ב-ORM או בשאילתות פרמטריות. לא להכניס קלט משתמש ישירות למחרוזת SQL.',implementation:'כל פעולת CRUD תשתמש ב-SQLAlchemy ORM או ב-bind parameters. שדות מיון נבחרים מ-allowlist.',test:'להכניס טקסט עם גרשיים ותבניות SQL לשדות; לא מתבצע שינוי בלוגיקת השאילתה.',code:`stmt = select(User).where(User.username == username)\nuser = session.scalar(stmt)`},
{title:'Brute Force | ניסיונות התחברות',level:'חובה במערכת משתמשים',threat:'תוקף מנסה סיסמאות רבות או סיסמה נפוצה על חשבונות רבים.',scenario:'עשרות ניסיונות התחברות כושלים בפרק זמן קצר.',defense:'Rate Limiting לפי חשבון ומקור, השהיה מדורגת, לוג אירועים והודעות שגיאה כלליות.',implementation:'לשמור חלון ניסיונות, להגביל ניסיונות כושלים ולמנוע עקיפה פשוטה של המגבלה.',test:'לשלוח ניסיונות שגויים בסביבת בדיקות; המערכת מחזירה הגבלה וממשיכה לאפשר שימוש תקין.',note:'נעילה קבועה של חשבון יכולה בעצמה לשמש לתקיפת מניעת שירות.'},
{title:'Authentication | זיהוי משתמש',level:'חובה במערכת משתמשים',threat:'בקשות ללא אימות או עם Token מזויף מאפשרות התחזות.',scenario:'לקוח שולח user_id=17 וטוען שהוא המשתמש 17.',defense:'השרת מזהה את המשתמש באמצעות Session תקף ולא סומך על מזהה שנשלח בגוף הבקשה.',implementation:'להנפיק Session לאחר התחברות, לאמת אותו בכל פעולה מוגנת ולבטל אותו ביציאה.',test:'בקשה ללא Session, עם Session מזויף או פג תוקף נדחית.'},
{title:'Authorization | IDOR',level:'חובה במשאבים פרטיים',threat:'משתמש מחליף file_id או order_id וניגש למשאב של משתמש אחר.',scenario:'משתמש A מבקש /files/52, שהוא קובץ של משתמש B.',defense:'בדיקת בעלות או הרשאה בצד השרת עבור כל משאב וכל פעולה.',implementation:'ליצור פונקציית בדיקת הרשאות מרכזית; לא להסתמך על הסתרת כפתורים ב-GUI.',test:'משתמש A מנסה לקרוא, לעדכן ולמחוק משאב של B — כל הפעולות נדחות.'},
{title:'Sessions | מחשב יחיד',level:'מומלץ במערכת משתמשים',threat:'גניבת Session מאפשרת התחזות; ריבוי חיבורים עשוי לסתור את מדיניות המערכת.',scenario:'אותו חשבון מתחבר ממחשב A ואז ממחשב B.',defense:'Session Token אקראי, תפוגה, Logout, ביטול Session קודם בהתחברות חדשה.',implementation:'לשמור בשרת מזהה Session פעיל אחד לכל משתמש, ולבדוק אותו בכל בקשה; ב-Web להגדיר Secure/HttpOnly/SameSite Cookies.',test:'לאחר התחברות B, בקשה נוספת מ-A נדחית; גם Token שבוטל נדחה.',code:`import secrets\ntoken = secrets.token_urlsafe(32)\n# Store a digest, expiry and user ID on the server`,note:'אי אפשר לזהות באופן אמין מחשב פיזי רק באמצעות IP או MAC. Session יחיד אינו מונע כשלעצמו גניבת Token.'},
{title:'DoS / DDoS',level:'חובה בשרת רשת',threat:'בקשות רבות או חיבורים איטיים צורכים CPU, זיכרון וחיבורים ומונעים שירות ממשתמשים תקינים.',scenario:'לקוחות רבים פותחים חיבורים ושולחים בקשות בקצב גבוה.',defense:'Rate Limiting, Timeout, הגבלת גודל בקשה, מספר חיבורים ומשאבי עיבוד.',implementation:'למדוד עומס, להגדיר ספי קצב וחיבורים, לשחרר משאבים ולתעד חסימות.',test:'להפעיל מחולל עומס מקומי מבוקר ולמדוד זמני תגובה, שיעור דחיות וצריכת משאבים.',note:'מימוש אפליקטיבי אינו הגנה מלאה מ-DDoS מבוזר גדול; לכך נדרשת גם תשתית חיצונית.'},
{title:'XSS | הזרקת תוכן בדפדפן',level:'חובה במערכת Web',threat:'טקסט משתמש מוצג כ-HTML פעיל ויכול להריץ JavaScript בהקשר של אתר אחר.',scenario:'הודעת צ׳אט עם תגיות HTML מוצגת בדף ללא קידוד פלט.',defense:'קידוד פלט לפי הקשר, שימוש ב-textContent, תבניות בטוחות ו-CSP כשכבת הגנה.',implementation:'לא להשתמש ב-innerHTML עם קלט לא מהימן; לבצע escaping בעת הצגת תוכן.',test:'טקסט הכולל תגיות HTML מוצג כתוכן רגיל ואינו מופעל.'},
{title:'CSRF | בקשה בשם משתמש',level:'חובה כשיש Cookie Session',threat:'דפדפן מחובר נשלח לבצע פעולה משנה מצב ממקור זדוני ללא כוונת המשתמש.',scenario:'אתר זר מנסה לגרום לדפדפן מחובר לבצע בקשת שינוי סיסמה.',defense:'CSRF Token, SameSite Cookies, אימות Origin לפי הצורך והימנעות משינוי מצב ב-GET.',implementation:'להגן על טפסים ופעולות משנות מצב המתבססות על Cookies.',test:'בקשה ללא Token תקין או ממקור לא מורשה נדחית.'},
{title:'העלאת קבצים בטוחה',level:'חובה במערכת קבצים',threat:'קובץ גדול, סוג אסור או שם זדוני עלולים לגרום לנזק, דליפת מידע או ביצוע תוכן מסוכן.',scenario:'משתמש מעלה קובץ עם שם מתעתע או גודל חריג.',defense:'הגבלת גודל, בדיקת סוג, שם אחסון אקראי, שמירה מחוץ לתיקייה ציבורית ובדיקת הרשאות.',implementation:'לממש allowlist לסוגי קבצים, מגבלות גודל, הפרדת מטא-דאטה משם הקובץ הפיזי.',test:'קובץ גדול או סוג אסור נדחה; קובץ מותר נשמר תחת שם שרת בטוח.'},
{title:'Path Traversal | נתיבי קבצים',level:'חובה במערכת קבצים',threat:'נתיב עם ../ מאפשר ניסיון לקרוא קבצים מחוץ לתיקיית האחסון.',scenario:'בקשת הורדה עם שם כגון ../../config.env.',defense:'לא להשתמש בנתיב חופשי מהלקוח; לזהות קבצים לפי ID ולמפות לנתיב שנוצר בשרת.',implementation:'לבדוק שהנתיב הסופי נשאר בתיקיית האחסון; למנוע מעבר דרך symlinks לפי הצורך.',test:'בקשה לנתיב מחוץ לתיקייה נדחית ללא חשיפת מידע.'},
{title:'הצפנת מידע במנוחה',level:'מומלץ למידע רגיש',threat:'גניבת קובץ בסיס נתונים או גיבוי חושפת מידע אישי או סודי.',scenario:'תוקף מקבל עותק של קובץ SQLite ומנסה לקרוא נתונים.',defense:'הצפנה מאומתת כגון AES-GCM או Fernet; מפתחות נשמרים בנפרד מהנתונים.',implementation:'להגדיר שדות רגישים, להצפין לפני שמירה ולפענח רק לאחר בדיקת הרשאה.',test:'קריאת בסיס הנתונים ללא המפתח אינה חושפת את התוכן; שינוי ciphertext גורם לכישלון אימות.',note:'לא להצפין סיסמאות במקום Hashing; אלו שימושים שונים.'},
{title:'Secrets | ניהול מפתחות וסודות',level:'חובה',threat:'מפתחות API, מפתחות הצפנה וסיסמאות בסיס נתונים נחשפים אם הוכנסו לקוד או ל-Git.',scenario:'קובץ config.py מכיל מפתח סודי והועלה למאגר ציבורי.',defense:'משתני סביבה או מנהל סודות, הרשאות מינימליות, קובץ .gitignore ורוטציה במקרה דליפה.',implementation:'להוציא סודות מהקוד, לספק קובץ .env.example ללא ערכים סודיים ולבדוק היסטוריית Git.',test:'סריקה של המאגר אינה מוצאת סודות אמיתיים; היישום עובד כשהסודות מסופקים בזמן ריצה.'},
{title:'Security Logging | ניטור',level:'חובה',threat:'ללא לוגים לא ניתן לזהות שימוש חריג, לשחזר אירועים או לחקור כשל.',scenario:'ניסיונות התחברות כושלים חוזרים ללא כל תיעוד.',defense:'לוג מובנה עם זמן, סוג אירוע, משתמש, מקור ותוצאה; הגנה על הלוג מפני שינוי.',implementation:'לתעד כניסות, כישלונות, דחיות הרשאה, מחיקות ושינויי הרשאות; לא לתעד סיסמאות או Tokens.',test:'כל אירוע אבטחה יוצר רשומה שימושית ללא סודות.'},
{title:'Anomaly Detection | זיהוי חריגות',level:'הרחבה מתקדמת',threat:'שימוש לרעה עשוי להיראות כפעילות חוקית בודדת אך חריגה בדפוס הכולל.',scenario:'משתמש מוחק עשרות קבצים בזמן קצר או מתחבר בשעות לא שגרתיות.',defense:'כללים מבוססי ספים, חלונות זמן, התראות וניתוח אירועים; אפשר לשלב מודל ML.',implementation:'להגדיר 2–3 דפוסים, להפיק התראות ולנהל False Positives.',test:'להזין לוג תקין ולוג חריג ולמדוד זיהוי שגוי וחסר.'},
{title:'Replay Attack | שימוש חוזר בהודעה',level:'הרחבה מתקדמת',threat:'תוקף משדר שוב בקשה תקינה שנקלטה קודם וגורם לביצוע כפול.',scenario:'בקשת תשלום או שינוי הרשאה נשלחת פעם נוספת.',defense:'Nonce חד-פעמי, מזהה בקשה, זמן תפוגה ובדיקת כפילויות בשרת; TLS לבדו אינו פותר כל Replay ברמת האפליקציה.',implementation:'לשמור מזהי פעולות רגישות שכבר בוצעו ולדחות ניסיון חוזר.',test:'שליחת אותה בקשה פעמיים מבצעת את הפעולה פעם אחת בלבד.'},

const deepTopics=[{"threat": "TLS מאמת את השרת בעזרת תעודת X.509 ושרשרת אמון. בלי אימות תעודה תוקף ברשת יכול להתחזות לשרת גם אם הערוץ מוצפן. TLS 1.3 משתמש בהחלפת מפתחות ליצירת מפתחות סימטריים; Certificate אינו תחליף להצפנה.", "defense": "יש להנפיק תעודת פיתוח, להגדיר certfile/keyfile בשרת ו-ca file בלקוח, להפעיל אימות hostname ולבדוק גם דחיית תעודה זרה.", "code": "# server.py – requires server.crt and server.key\nimport socket, ssl\nctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)\nctx.minimum_version = ssl.TLSVersion.TLSv1_2\nctx.load_cert_chain('server.crt', 'server.key')\nwith socket.create_server(('127.0.0.1', 8443)) as listener:\n    with ctx.wrap_socket(listener, server_side=True) as server:\n        conn, addr = server.accept()\n        with conn:\n            print(conn.recv(4096))\n\n# client.py – trust the local development certificate\nimport socket, ssl\nctx = ssl.create_default_context(cafile='server.crt')\nwith socket.create_connection(('localhost', 8443)) as raw:\n    with ctx.wrap_socket(raw, server_hostname='localhost') as tls:\n        tls.sendall(b'hello over TLS')\n# Certificate must include localhost in SAN."}, {"threat": "אם בסיס הנתונים נגנב, סיסמאות בטקסט גלוי נחשפות מיד. SHA-256 מהיר מדי עבור סיסמאות ומאפשר ניחוש המוני. Salt ייחודי מונע זהות בין גיבובים; Pepper מוסיף סוד שנמצא מחוץ למסד.", "defense": "ביצירת משתמש: hash; בכניסה: verify; לאחר אימות מוצלח ניתן לבצע rehash לפי צורך. אין לשמור סיסמה מקורית ואין להחזיר הודעת שגיאה החושפת קיום חשבון.", "code": "# pip install argon2-cffi\nfrom argon2 import PasswordHasher\nfrom argon2.exceptions import VerifyMismatchError, VerificationError\nph = PasswordHasher()\n\ndef register(password: str) -> str:\n    return ph.hash(password)  # includes random salt\n\ndef login(password: str, stored_hash: str) -> bool:\n    try:\n        return ph.verify(stored_hash, password)\n    except (VerifyMismatchError, VerificationError):\n        return False\n\na = register('Strong example passphrase!')\nb = register('Strong example passphrase!')\nassert a != b\nassert login('Strong example passphrase!', a)\nassert not login('wrong', a)\n# Optional Pepper requires separate secret management and design."}, {"threat": "SQL Injection נוצר כאשר קלט המשתמש הופך לחלק מתחביר השאילתה. התוקף עלול לשנות WHERE, לקרוא רשומות שלא הורשה או לבצע שינוי נתונים.", "defense": "יש להשתמש ב-ORM או bind parameters בכל מסלולי CRUD. גם ORDER BY ושמות עמודות חייבים להיבחר מתוך רשימת ערכים מותרת ולא להיות משורשרים מקלט חופשי.", "code": "from sqlalchemy import select, text\n\ndef find_user(session, username):\n    stmt = select(User).where(User.username == username)\n    return session.scalar(stmt)\n\ndef find_user_raw(session, username):\n    stmt = text('SELECT id FROM users WHERE username=:name')\n    return session.execute(stmt, {'name': username}).first()\n\nALLOWED_SORT = {'name': User.username, 'created': User.created_at}\ndef list_users(session, sort_by):\n    column = ALLOWED_SORT.get(sort_by, User.username)\n    return session.scalars(select(User).order_by(column)).all()\n\nassert find_user(session, \"' OR '1'='1\") is None  # test fixture"}, {"threat": "Brute Force הוא ניחוש חוזר של סיסמאות לחשבון אחד; Password Spraying מנסה סיסמה נפוצה על חשבונות רבים. ללא הגבלת קצב ניתן להריץ אלפי ניסיונות.", "defense": "יש להגביל לפי חשבון וגם לפי מקור, להשתמש בחלון זמן ולתעד חסימות. לא לבצע נעילה קבועה שקל לנצל ל-DoS; בשרת מרובה תהליכים יש להשתמש באחסון משותף.", "code": "from collections import defaultdict, deque\nfrom time import monotonic\n\nfailures = defaultdict(deque)\nWINDOW, LIMIT = 60, 5\n\ndef can_attempt(account: str, source: str) -> bool:\n    key = (account, source)\n    now = monotonic()\n    q = failures[key]\n    while q and now - q[0] > WINDOW:\n        q.popleft()\n    return len(q) < LIMIT\n\ndef record_failure(account: str, source: str):\n    failures[(account, source)].append(monotonic())\n\n# Before password verification:\n# if not can_attempt(username, client_ip): reject with 429\n# on failed password: record_failure(username, client_ip)\n# Demo only: production needs shared storage and global limits."}, {"threat": "Authentication קובע מי פונה לשרת. שדה user_id בגוף הבקשה אינו הוכחת זהות: לקוח זדוני יכול לשנות אותו כרצונו.", "defense": "אחרי אימות סיסמה השרת יוצר Session אקראי ומחזיק שיוך למשתמש. בכל פעולה מאמתים את ה-Session ומפיקים ממנו את זהות המשתמש.", "code": "import secrets, hashlib\nfrom datetime import datetime, timedelta, timezone\n\nsessions = {}  # digest -> (user_id, expiry)\n\ndef new_session(user_id):\n    token = secrets.token_urlsafe(32)\n    digest = hashlib.sha256(token.encode()).hexdigest()\n    sessions[digest] = (user_id, datetime.now(timezone.utc) + timedelta(hours=1))\n    return token\n\ndef authenticated_user(token):\n    digest = hashlib.sha256(token.encode()).hexdigest()\n    row = sessions.get(digest)\n    if not row or row[1] <= datetime.now(timezone.utc):\n        raise PermissionError('Unauthenticated')\n    return row[0]\n# Persist securely in a real DB; use HTTPS for token transport."}, {"threat": "IDOR הוא כשל הרשאות: המשתמש כבר מחובר אך מנסה לגשת למשאב של אחר באמצעות שינוי מזהה. הסתרת כפתור אינה מונעת בקשת API ישירה.", "defense": "בדיקת הרשאות חייבת להיות בשרת, בכל קריאה וכתיבה, לפי המשתמש המאומת והמשאב המבוקש. ברירת מחדל: דחייה.", "code": "from sqlalchemy import select\n\ndef download_file(session, authenticated_user_id, file_id):\n    stmt = select(File).where(\n        File.id == file_id,\n        File.owner_id == authenticated_user_id\n    )\n    file_record = session.scalar(stmt)\n    if file_record is None:\n        raise PermissionError('File unavailable')\n    return read_from_storage(file_record.storage_key)\n\n# Tests: A can download own file; B cannot download A's file.\n# Shared files require an explicit permission check too."}, {"threat": "Session Hijacking הוא שימוש ב-Token גנוב. מדיניות מחשב יחיד פירושה Session פעיל אחד לחשבון, ולא זיהוי פיזי אמין של מחשב.", "defense": "בכניסה חדשה מבטלים את כל ה-Sessions הישנים; כל בקשה בודקת את ה-Token מול השרת. יש תפוגה, Logout, Cookies מאובטחים ב-Web, ו-TLS בכל העברה.", "code": "import secrets, hashlib\nactive = {}  # user_id -> token digest\n\ndef issue_single_session(user_id):\n    token = secrets.token_urlsafe(32)\n    active[user_id] = hashlib.sha256(token.encode()).hexdigest()\n    return token\n\ndef validate_single_session(user_id, token):\n    digest = hashlib.sha256(token.encode()).hexdigest()\n    expected = active.get(user_id)\n    return expected is not None and secrets.compare_digest(expected, digest)\n\ndef logout(user_id):\n    active.pop(user_id, None)\n\na = issue_single_session(7)\nb = issue_single_session(7)\nassert not validate_single_session(7, a)\nassert validate_single_session(7, b)\n# Production: atomic DB/Redis state, expiry and secure cookie."}, {"threat": "DoS שוחק משאבי שרת באמצעות הרבה בקשות, הודעות גדולות או חיבורים איטיים. DDoS מגיע ממקורות רבים ולכן חסימת כתובת בודדת אינה מספיקה.", "defense": "יש להגדיר מגבלת גודל הודעה, timeout, מגבלת קצב וחיבורים במקביל, ולהגביל עבודות יקרות. DDoS רחב מצריך גם הגנת תשתית.", "code": "import socket, threading\nMAX_CLIENTS = 20\nMAX_MESSAGE = 4096\nslots = threading.BoundedSemaphore(MAX_CLIENTS)\n\ndef handle_client(conn):\n    try:\n        conn.settimeout(5.0)\n        with conn:\n            data = conn.recv(MAX_MESSAGE + 1)\n            if len(data) > MAX_MESSAGE:\n                return  # reject oversized request\n            # Validate framed message length in full protocol\n            conn.sendall(b'OK')\n    except (socket.timeout, OSError):\n        pass\n    finally:\n        slots.release()\n\ndef accept_one(server):\n    conn, _ = server.accept()\n    if not slots.acquire(blocking=False):\n        conn.close()\n        return\n    threading.Thread(target=handle_client, args=(conn,), daemon=True).start()\n# Controlled localhost load tests only."}, {"threat": "XSS נוצר כשנתון לא מהימן הופך לקוד HTML/JavaScript בדפדפן. הוא עלול לשנות ממשק, לבצע פעולות בשם המשתמש או לחשוף מידע נגיש לסקריפט.", "defense": "הצגת תוכן משתמש כטקסט באמצעות textContent, Escaping לפי הקשר, הימנעות מ-innerHTML לא מהימן ו-CSP כשכבה נוספת.", "code": "<!-- Unsafe: element.innerHTML = userMessage -->\n<div id=\"message\"></div>\n<script>\n  const userMessage = '<img src=x onerror=alert(1)>';\n  const element = document.getElementById('message');\n  element.textContent = userMessage; // shown as text\n  // In server-side templates keep auto-escaping enabled.\n<\/script>"}, {"threat": "CSRF מנצל את העובדה שהדפדפן מצרף Cookies אוטומטית גם לבקשה שהופעלה מאתר זר. כך ניתן לנסות לבצע פעולה בשם משתמש מחובר.", "defense": "בפעולות POST/PUT/DELETE המבוססות על Cookie יש לאמת CSRF Token, להגדיר SameSite ולבדוק Origin בהתאם לארכיטקטורה. GET לא משנה מצב.", "code": "# Flask + Flask-WTF example\n# pip install flask-wtf\nfrom flask import Flask, render_template\nfrom flask_wtf import CSRFProtect, FlaskForm\nfrom wtforms import StringField, SubmitField\n\napp = Flask(__name__)\napp.config['SECRET_KEY'] = 'LOAD_FROM_ENV_NOT_SOURCE'\napp.config['SESSION_COOKIE_SECURE'] = True  # HTTPS\napp.config['SESSION_COOKIE_HTTPONLY'] = True\napp.config['SESSION_COOKIE_SAMESITE'] = 'Lax'\ncsrf = CSRFProtect(app)\n\nclass UpdateForm(FlaskForm):\n    display_name = StringField('Name')\n    submit = SubmitField('Save')\n\n# In Jinja template: {{ form.csrf_token }}\n# Missing/invalid token is rejected. Replace placeholder secret!"}, {"threat": "קובץ שהועלה יכול להיות עצום, בעל סיומת מטעה או תוכן מסוכן. שמירה בשם שנשלח מהלקוח עלולה לגרום לדריסה או לחשיפת קבצים.", "defense": "לבדוק גודל וסוג מותר, לייצר שם אחסון אקראי, לשמור מחוץ לתיקיית Web ולבדוק הרשאות בכל הורדה. בדיקת סיומת לבדה אינה מספיקה.", "code": "from pathlib import Path\nimport secrets\n\nUPLOAD_DIR = Path('private_uploads')\nUPLOAD_DIR.mkdir(exist_ok=True)\nALLOWED = {'.txt', '.pdf', '.png'}\nMAX_BYTES = 2 * 1024 * 1024\n\ndef save_upload(filename, stream):\n    suffix = Path(filename).suffix.lower()\n    if suffix not in ALLOWED:\n        raise ValueError('Unsupported type')\n    content = stream.read(MAX_BYTES + 1)\n    if len(content) > MAX_BYTES:\n        raise ValueError('File too large')\n    key = secrets.token_hex(20) + suffix\n    (UPLOAD_DIR / key).write_bytes(content)\n    return key\n# Also validate actual file format, permissions, and scan when needed."}, {"threat": "Path Traversal מאפשר ניסיון לגשת לקבצים מחוץ לתיקייה המותרת בעזרת ../ או נתיב מוחלט. גם symlinks עלולים לעקוף בדיקות נאיביות.", "defense": "אין לקבל נתיב שרירותי מהלקוח. הלקוח שולח file_id, והשרת שולף storage_key שנוצר בשרת ומוודא שהנתיב נשאר בשורש האחסון.", "code": "from pathlib import Path\nROOT = Path('private_uploads').resolve()\n\ndef safe_path(storage_key):\n    # Storage keys must be generated by server, not user filenames\n    candidate = (ROOT / storage_key).resolve()\n    if not candidate.is_relative_to(ROOT):  # Python 3.9+\n        raise PermissionError('Invalid path')\n    return candidate\n\ntry:\n    safe_path('../../secrets.env')\n    assert False, 'Traversal should fail'\nexcept PermissionError:\n    pass\n# Check user permissions before accessing the file."}, {"threat": "אם תוקף מקבל עותק של SQLite או גיבוי, נתונים גלויים נחשפים. הצפנה מאומתת מגינה גם מפני שינוי שקט של ciphertext.", "defense": "להצפין שדות רגישים עם Fernet/AES-GCM ולשמור את המפתח בנפרד. יש להגדיר תהליך גיבוי, החלפת מפתחות וטיפול בשגיאות פענוח.", "code": "# pip install cryptography\nimport os\nfrom cryptography.fernet import Fernet, InvalidToken\n\n# Generate once: Fernet.generate_key(), store securely\nkey = os.environ['FERNET_KEY'].encode()\nfernet = Fernet(key)\n\ndef encrypt_field(value: str) -> bytes:\n    return fernet.encrypt(value.encode('utf-8'))\n\ndef decrypt_field(ciphertext: bytes) -> str:\n    return fernet.decrypt(ciphertext).decode('utf-8')\n\nsecret = encrypt_field('confidential')\nassert decrypt_field(secret) == 'confidential'\n# Never generate a fresh key on each application restart."}, {"threat": "סודות בקוד מקור או במאגר Git עלולים לאפשר גישה למסד, שירותי ענן או מידע מוצפן. מחיקת הסוד מהגרסה האחרונה אינה מבטלת חשיפה בהיסטוריה.", "defense": "לקרוא סודות ממשתני סביבה או מנהל סודות, להגדיר הרשאות מינימליות, להוסיף .env ל-gitignore ולבצע רוטציה אם דלפו.", "code": "import os\n\ndef required_secret(name):\n    value = os.getenv(name)\n    if not value:\n        raise RuntimeError(f'Missing environment variable: {name}')\n    return value\n\nDATABASE_URL = required_secret('DATABASE_URL')\n# .gitignore should contain: .env\n# .env.example should contain placeholders only\n# Do not print DATABASE_URL or secret values."}, {"threat": "ללא לוגים קשה לזהות ניסיונות התחברות חריגים, גישה אסורה או מחיקות חשודות. לוג שמכיל סיסמאות או Tokens יוצר בעצמו סיכון.", "defense": "לתעד אירוע, זמן UTC, מזהה משתמש, תוצאה וסוג פעולה. לא לרשום תוכן רגיש. לשמור לוגים עם בקרת גישה ומדיניות שמירה.", "code": "import logging, json\nfrom datetime import datetime, timezone\nlogging.basicConfig(level=logging.INFO)\nsecurity_log = logging.getLogger('security')\n\ndef log_security(event, user_id, result):\n    record = {\n        'time': datetime.now(timezone.utc).isoformat(),\n        'event': event,\n        'user_id': user_id,\n        'result': result,\n    }\n    security_log.info(json.dumps(record, ensure_ascii=False))\n\nlog_security('login_failed', 42, 'denied')\n# Never log passwords, session tokens or encryption keys."}, {"threat": "פעולה בודדת יכולה להיראות חוקית, אבל רצף פעולות עשוי להעיד על מתקפה: עשרות מחיקות, גישה חריגה או ניסיונות התחברות רצופים.", "defense": "להגדיר כלל מדיד עם חלון זמן, סף והתראה; למדוד False Positives ו-False Negatives; לתעד מדוע ההתראה נוצרה.", "code": "from collections import defaultdict, deque\nfrom datetime import datetime, timedelta, timezone\n\nrecent_deletes = defaultdict(deque)\n\ndef record_delete(user_id, now=None):\n    now = now or datetime.now(timezone.utc)\n    q = recent_deletes[user_id]\n    q.append(now)\n    while q and now - q[0] > timedelta(minutes=2):\n        q.popleft()\n    if len(q) >= 10:\n        return {'alert': 'mass_delete', 'user_id': user_id, 'count': len(q)}\n    return None\n\n# Simulate normal activity and 10 deletes in two minutes."}, {"threat": "Replay הוא שימוש חוזר בבקשה תקינה שנשלחה בעבר. גם אם התוכן מוצפן, פעולה עסקית יכולה להתבצע פעמיים אם אין זיהוי כפילויות.", "defense": "להשתמש במזהה בקשה חד-פעמי (Idempotency Key), לקשור אותו למשתמש ולפעולה, ולשמור תוצאה כדי להחזיר אותה בבקשה חוזרת.", "code": "# Simplified single-process example; use DB unique constraint in production\ncompleted = {}\n\ndef execute_once(user_id, request_id, action):\n    key = (user_id, request_id)\n    if key in completed:\n        return completed[key]\n    result = action()\n    completed[key] = result\n    return result\n\ncounter = {'value': 0}\ndef perform():\n    counter['value'] += 1\n    return counter['value']\n\nassert execute_once(7, 'req-123', perform) == 1\nassert execute_once(7, 'req-123', perform) == 1\nassert counter['value'] == 1\n# Production: atomic transaction, expiry and request-payload binding."}, {"threat": "בדיקה של תרחיש תקין בלבד אינה מוכיחה אבטחה. צריך לנסות גם קלט לא צפוי, Token מזויף, משתמש ללא הרשאה, גבולות עומס ופעולות חוזרות.", "defense": "לכל הגנה לכתוב בדיקת הצלחה, בדיקת דחייה ובדיקת גבול; להשתמש ב-pytest ובסביבת נתונים מבודדת. לתעד את ההוכחה ואת המגבלות.", "code": "# pytest – use a test client and isolated fixture\ndef test_private_file_denied(client, user_b_token, file_of_a):\n    response = client.get(\n        f'/files/{file_of_a.id}',\n        headers={'Authorization': f'Bearer {user_b_token}'}\n    )\n    assert response.status_code in (403, 404)\n\ndef test_missing_session_denied(client, file_of_a):\n    response = client.get(f'/files/{file_of_a.id}')\n    assert response.status_code == 401\n\n# Add tests for valid owner access and revoked sessions.\n# These examples assume project-specific fixtures."}];

let current=0;const el=document.getElementById('slides');function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}el.innerHTML=slides.map((s,i)=>`<article class="slide" id="s${i}">${s}</article>`).join('');function go(n){current=Math.max(0,Math.min(n,slides.length-1));document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('active',i===current));document.getElementById('bar').style.width=((current+1)/slides.length*100)+'%';document.getElementById('count').textContent=`${current+1} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;window.scrollTo({top:0,behavior:'instant'})}function move(n){go(current+n)}function toggle(id){document.getElementById(id).classList.toggle('show')}function showIndex(){let names=['פתיחה','מטרות','מושגים','מפת אבטחה',...topics.map(x=>x.title),'חידון 1','חידון 2','חידון 3','התאמה לפרויקט','משימת סיכום','סיום'];let html=`<div class="eyebrow">ניווט מהיר</div><h2>תוכן העניינים</h2><div class="grid grid3">${names.map((x,i)=>`<button class="choice" onclick="go(${i})">${i+1}. ${x}</button>`).join('')}</div>`;let existing=document.getElementById('indexOverlay');if(existing){existing.remove();return}let box=document.createElement('div');box.id='indexOverlay';box.style='position:fixed;inset:0;z-index:5;background:#081225;overflow:auto;padding:30px max(20px,calc((100vw - 1100px)/2))';box.innerHTML=`<button class="btn" onclick="document.getElementById('indexOverlay').remove()">סגור ✕</button>${html}`;document.body.appendChild(box);box.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>box.remove()))}
const quizzes=[{id:1,choices:['SHA-256 רגיל ללא Salt','Argon2id עם Salt ייחודי','AES עם מפתח שמור באותה טבלה'],correct:1,explain:'Argon2id נועד לגיבוב סיסמאות. Salt ייחודי מקשה על שימוש בטבלאות מוכנות ומונע גיבובים זהים.'},{id:2,choices:['ה-GUI מסתיר את כפתור ההורדה','השרת בודק הרשאה לכל קובץ','מספיק שהמשתמש מחובר'],correct:1,explain:'השרת חייב לבדוק הרשאות לכל משאב ופעולה, גם אם הבקשה נשלחת ללא GUI.'},{id:3,choices:['כן, תמיד','לא, צריך גם הגנות תשתיתיות מול DDoS משמעותי','כן, אם משתמשים ב-HTTPS'],correct:1,explain:'Rate Limiting מסייע בהפחתת עומס, אך מתקפה מבוזרת גדולה יכולה להציף את התשתית עצמה.'}];quizzes.forEach(q=>{document.getElementById('q'+q.id).innerHTML=q.choices.map((c,i)=>`<button class="choice" onclick="answer(${q.id},${i})">${c}</button>`).join('')});function answer(id,idx){let q=quizzes[id-1],root=document.getElementById('q'+id);root.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('good',i===q.correct);b.classList.toggle('wrong',i===idx&&idx!==q.correct)});document.getElementById('f'+id).textContent=(idx===q.correct?'✓ נכון! ':'✕ לא בדיוק. ')+q.explain}
const features=[['users','משתמשים והתחברות'],['network','תקשורת לקוח–שרת'],['database','בסיס נתונים'],['web','ממשק Web'],['files','קבצים ושיתוף'],['sensitive','מידע אישי רגיש']];const recommendations=[['TLS והצפנת תעבורה',['network','web']],['Argon2id + Salt',['users']],['הגנת Brute Force',['users']],['Sessions והרשאות',['users']],['SQL פרמטרי / ORM',['database']],['הגנות XSS ו-CSRF',['web']],['בדיקות העלאת קבצים ונתיבים',['files']],['הצפנת מידע שמור',['sensitive']],['Rate Limiting ו-Timeout',['network','web']],['לוגים ובדיקות אבטחה',[]]];let checked=new Set(['users','network','database']);document.getElementById('featureBox').innerHTML='<h3>מאפייני הפרויקט</h3>'+features.map(([k,v])=>`<label class="checkrow"><input type="checkbox" ${checked.has(k)?'checked':''} onchange="changeFeature('${k}',this.checked)">${v}</label>`).join('');function changeFeature(k,v){v?checked.add(k):checked.delete(k);renderRecommendations()}function selectedRecs(){return recommendations.filter(([n,keys])=>!keys.length||keys.some(k=>checked.has(k))).map(x=>x[0])}function renderRecommendations(){document.getElementById('recommendations').innerHTML='<ul>'+selectedRecs().map(x=>`<li>${x}</li>`).join('')+'</ul>'}function copyChecklist(){let text='דרישות אבטחה לפרויקט הגמר:\n'+selectedRecs().map((x,i)=>(i+1)+'. '+x).join('\n');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>document.getElementById('copied').textContent='הרשימה הועתקה').catch(()=>fallbackCopy(text))}else fallbackCopy(text)}function fallbackCopy(text){let a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');document.getElementById('copied').textContent='הרשימה הועתקה'}catch(e){document.getElementById('copied').textContent='לא ניתן להעתיק אוטומטית'}a.remove()}renderRecommendations();document.addEventListener('keydown',e=>{if(document.getElementById('indexOverlay'))return;if(e.key==='ArrowLeft')move(1);if(e.key==='ArrowRight')move(-1)});go(0);
</script></body></html>
