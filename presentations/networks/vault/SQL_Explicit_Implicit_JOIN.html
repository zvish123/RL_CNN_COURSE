*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#142b42;font-family:Arial,sans-serif}header,footer{background:white;padding:14px 4vw;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid #d5e0e9}main{max-width:1150px;margin:22px auto;padding:0 18px}article{background:white;border:1px solid #d5e0e9;border-radius:20px;padding:clamp(18px,4vw,48px);min-height:65vh;box-shadow:0 8px 30px #17334a0d}h1{font-size:clamp(26px,4vw,44px);margin:0 0 18px}h2{font-size:24px;color:#087c82}p{font-size:20px;line-height:1.65;white-space:pre-line}pre{direction:ltr;text-align:left;background:#edf5f8;border-left:5px solid #087c82;padding:18px;border-radius:8px;overflow:auto;font-size:clamp(13px,2vw,20px);line-height:1.6;margin:8px 0}button,select{font:inherit;border:1px solid #a9c3d0;border-radius:8px;padding:10px 15px;background:white;color:#16364c;cursor:pointer}button.primary,button.active{background:#087c82;color:white;border-color:#087c82}button:disabled{opacity:.4;cursor:default}footer{justify-content:center;position:sticky;bottom:0;border-top:1px solid #d5e0e9}table{border-collapse:collapse;width:100%;direction:ltr;text-align:left;margin:12px 0}td,th{padding:10px;border:1px solid #cbd9e3}th{background:#e4eff5} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.note{background:#eaf7f5;padding:16px;border-radius:10px;border-right:4px solid #087c82}.muted{color:#536a7e;font-size:15px}.bar{height:6px;background:#dce6ed}.bar div{height:100%;background:#087c82}textarea{width:100%;min-height:120px;direction:ltr;font:16px monospace;padding:12px;border:1px solid #a9c3d0;border-radius:8px}details{margin:16px 0;padding:14px;background:#f0f6fa;border-radius:10px}summary{cursor:pointer;font-weight:bold}svg{max-width:100%;height:auto}label{display:block;margin:12px 0;font-size:18px} .good{background:#d9f4e7}.bad{background:#f1f3f5;color:#637587} .hero{background:linear-gradient(120deg,#e4f6f4,#edf3ff);padding:20px;border-radius:16px} .method{background:white;border:1px solid #cbd9e3;border-radius:12px;padding:16px}.method pre{font-size:16px}.compare{direction:rtl;text-align:right} @media print{header,footer,.bar,button{display:none}article{box-shadow:none}} </style><header><b>SQL LAB · EXPLICIT &amp; IMPLICIT JOIN</b><span class="muted">י״א סייבר</span><select id="jump" aria-label="בחירת שקף"></select><button id="full">מסך מלא</button></header><div class="bar"><div id="progress"></div></div><main><article id="slide"></article></main><footer><button id="prev">→ הקודם</button><b id="count"></b><button class="primary" id="next">הבא ←</button></footer><script>
const data=[["חיבור טבלאות ב־SQL – Explicit JOIN ו־Implicit JOIN", "שתי דרכים לחיבור טבלאות | י״א סייבר", "איך יודעים למי יש הרשאה לקובץ?", "files\nפרטי הקובץ", "file_permissions\nהרשאות המשתמשים", "JOIN"], ["הבעיה: המידע מפוזר בין טבלאות", "מפתח ראשי ומפתח זר", "files\nid | original_name\n1  | report.pdf\n2  | photo.jpg\n3  | data.csv", "file_permissions\nid | file_id | user_id\n1  | 2       | 5\n2  | 1       | 3\n3  | 2       | 4", "בטבלת ההרשאות אין שם קובץ. מחברים את file_id למזהה id בטבלת הקבצים. לקובץ אחד עשויות להיות הרשאות רבות."], ["שיטה א׳ – Explicit JOIN", "חיבור מפורש", "JOIN מציין את הטבלה הנוספת; ON מגדיר את תנאי ההתאמה.", "SELECT f.original_name, p.user_id\nFROM file_permissions AS p\nJOIN files AS f ON p.file_id = f.id;", "AS מגדיר כינוי קצר לטבלה. JOIN ללא סוג מציין כאן INNER JOIN."], ["שיטה ב׳ – Implicit JOIN", "חיבור משתמע", "מציינים את הטבלאות בפסיקים ואת תנאי החיבור ב־WHERE.", "SELECT f.original_name, p.user_id\nFROM file_permissions AS p, files AS f\nWHERE p.file_id = f.id;", "לוגית: מכפלה קרטזית ואז סינון; המנוע אינו חייב לממש אותה בפועל."], ["מה קורה בחיבור?", "שלוש התאמות מתוך תשעה צירופים אפשריים", "× 2 = 1", "✓ 2 = 2", "× 2 = 3", "✓ 1 = 1", "× 1 = 2", "× 1 = 3", "× 2 = 1", "✓ 2 = 2", "× 2 = 3", "files.id=1", "files.id=2", "files.id=3", "p.id=1", "p.id=2", "p.id=3", "התוצאה: photo.jpg / 5, report.pdf / 3, photo.jpg / 4. סדר השורות אינו מובטח ללא ORDER BY."], ["חיבור לעומת סינון", "הפרדת אחריות", "SELECT f.original_name, p.user_id\nFROM file_permissions AS p\nJOIN files AS f ON p.file_id = f.id\nWHERE p.can_download = 1;", "ON: איזה קובץ מתאים להרשאה?\nWHERE: אילו הרשאות מעניינות אותנו?"], ["אותו סינון בשיטה המשתמעת", "SELECT f.original_name, p.user_id\nFROM file_permissions AS p, files AS f\nWHERE p.file_id = f.id\n  AND p.can_download = 1;", "שני סוגי התנאים מופיעים יחד. התוצאה זהה לחיבור הפנימי המפורש."], ["כששוכחים תנאי חיבור", "מכפלה קרטזית", "SELECT * FROM file_permissions AS p, files AS f;", "10 קבצים × 12 הרשאות\n120 שורות", "חיבור תקין\n12 שורות*", "* כאשר לכל הרשאה קובץ קיים אחד. גם JOIN ללא ON עלול ליצור מכפלה ב־SQLite."], ["חיבור של שלוש טבלאות", "שם הקובץ, הבעלים ומקבל ההרשאה", "SELECT f.original_name, o.username, u.username\nFROM file_permissions AS p\nJOIN files AS f ON p.file_id = f.id\nJOIN users AS o ON f.owner_id = o.id\nJOIN users AS u ON p.user_id = u.id;", "users מופיעה פעמיים בתפקידים שונים: בעלים ומקבל הרשאה."], ["אותו חיבור בכתיבה משתמעת", "SELECT f.original_name, o.username, u.username\nFROM file_permissions AS p, files AS f,\n     users AS o, users AS u\nWHERE p.file_id = f.id\n  AND f.owner_id = o.id\n  AND p.user_id = u.id;", "קל יותר לפספס תנאי כאשר מספר הטבלאות גדל."], ["LEFT JOIN – מה אם אין התאמה?", "SELECT f.original_name, p.user_id\nFROM files AS f\nLEFT JOIN file_permissions AS p ON f.id = p.file_id;", "INNER JOIN\nreport.pdf, photo.jpg (פעמיים)", "LEFT JOIN\nגם data.csv עם NULL"], ["השוואה והמלצה", "תוצאה: זהה עבור INNER JOIN שקול.\nביצועים: לרוב זהים ב־SQLite; ניתן לבדוק עם EXPLAIN QUERY PLAN.\nקריאות: JOIN מפריד בין תנאי חיבור לתנאי סינון.\nגמישות: LEFT JOIN מאפשר לשמור שורות ללא התאמה.\nהמלצה: להכיר את שתי השיטות ולהעדיף JOIN ... ON בפרויקט."], ["בדיקת הבנה – חשבו לפני החשיפה", "1. מה ההבדל בין ON לבין WHERE בדוגמת החיבור הפנימי?\n2. כמה שורות יתקבלו ללא תנאי חיבור כאשר יש 8 קבצים ו־15 הרשאות?\n3. האם השיטה המפורשת תמיד מהירה יותר?\n4. איזו שיטה מאפשרת להציג קבצים ללא הרשאות באמצעות LEFT JOIN?"], ["תשובות לשאלות ההבנה", "1. ON מתאר את ההתאמה; WHERE מסנן את התוצאה. בחיבור פנימי ניתן להעביר תנאי שקול ביניהם.\n2. 120 שורות (8 × 15).\n3. לא. האופטימייזר עשוי לבחור אותה תוכנית ביצוע.\n4. LEFT JOIN מפורש; קובץ ללא התאמה יופיע עם NULL."], ["תרגול יישום – משימה 1", "הציגו את שמות הקבצים שמשתמש מספר 3 רשאי להוריד.\nא. כתבו פתרון באמצעות JOIN ... ON.\nב. כתבו פתרון באמצעות FROM ... WHERE.\nג. הסבירו מה יקרה אם תשמיטו את תנאי החיבור.\nד. הריצו את שתי השאילתות והשוו את התוצאות."], ["פתרון משימה 1", "SELECT f.original_name\nFROM file_permissions AS p\nJOIN files AS f ON p.file_id = f.id\nWHERE p.user_id = 3 AND p.can_download = 1;", "SELECT f.original_name\nFROM file_permissions AS p, files AS f\nWHERE p.file_id = f.id\n  AND p.user_id = 3 AND p.can_download = 1;"], ["תרגול יישום – משימה 2", "הציגו את שמות המשתמשים שלא קיבלו אף הרשאת שיתוף.\nבחרו סוג חיבור מתאים.\nמהו השדה שעליו צריך לבדוק NULL?\nהאם משתמש שהוא בעל קובץ אך לא קיבל הרשאה מפורשת יופיע בתוצאה? נמקו."], ["פתרון משימה 2", "SELECT u.username\nFROM users AS u\nLEFT JOIN file_permissions AS p ON u.id = p.user_id\nWHERE p.id IS NULL;", "כן. בעלות על קובץ אינה הרשאת שיתוף מפורשת. בודקים את המפתח הראשי של טבלת ההרשאות כדי לזהות היעדר התאמה."], ["סיכום – שלוש שאלות לפני כתיבת שאילתה", "עם איזו טבלה מתחברים?  JOIN\nכיצד הטבלאות מתחברות?  ON\nאילו נתונים רוצים לקבל?  WHERE\n\nמשימת יציאה: כתבו שאילתה אחת בשתי השיטות והסבירו איזו גרסה הייתם מעדיפים בקוד הפרויקט ומדוע."]];let index=0;const $=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const table=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';const files=[[1,'report.pdf'],[2,'photo.jpg'],[3,'data.csv']], perms=[[1,2,5],[2,1,3],[3,2,4]];const tables=()=>'<div class="grid"><div><b>files</b>'+table(['id','original_name'],files)+'</div><div><b>file_permissions</b>'+table(['id','file_id','user_id'],perms)+'</div></div>';const code=s=>'<pre>'+esc(s)+'</pre><button class="copy">העתקת SQL</button>';const diagram=`<svg viewBox="0 0 700 200" role="img" aria-label="קשר בין קבצים להרשאות"><rect x="20" y="35" width="250" height="130" rx="15" fill="#dcecf9" stroke="#3879a5"/><rect x="430" y="35" width="250" height="130" rx="15" fill="#d9f3ec" stroke="#087c82"/><path d="M270 100 H430" stroke="#087c82" stroke-width="4"/><g text-anchor="middle" font-family="Arial" fill="#16364c" font-size="22"><text x="145" y="75">files</text><text x="145" y="120">id (PK)</text><text x="555" y="75">file_permissions</text><text x="555" y="120">file_id (FK)</text><text x="350" y="85">1 : N</text></g></svg>`;const methodVisual=explicit=>'<svg viewBox="0 0 780 150" role="img" aria-label="שלבי חיבור טבלאות" direction="ltr"><g font-family="Arial" font-size="17" text-anchor="middle" fill="#16364c">'+(explicit?['FROM A','JOIN B ON condition','Matched rows']:['FROM A, B','WHERE condition','Matched rows']).map((v,i)=>'<rect x="'+(10+i*265)+'" y="35" width="230" height="75" rx="12" fill="'+(i===2?'#d9f3ec':'#e3eef8')+'" stroke="#087c82"/><text x="'+(125+i*265)+'" y="79">'+v+'</text>').join('')+'<path d="M240 72 H272 M505 72 H537" stroke="#087c82" stroke-width="3"/><path d="M265 65 L273 72 L265 79 M530 65 L538 72 L530 79" fill="none" stroke="#087c82" stroke-width="3"/></g></svg><p class="muted">'+(explicit?'החיבור מתואר במפורש באמצעות ON.':'מבחינה לוגית: צירופי רשומות ולאחר מכן סינון ב־WHERE.')+' אין זה תיאור מחייב של סדר הביצוע במנוע SQL.</p>';const rolesDiagram=`<svg viewBox="0 0 780 240" role="img" aria-label="טבלת משתמשים בשני תפקידים" direction="ltr"><g fill="#e3eef8" stroke="#087c82"><rect x="20" y="20" width="200" height="65" rx="10"/><rect x="20" y="155" width="200" height="65" rx="10"/><rect x="290" y="20" width="200" height="65" rx="10"/><rect x="550" y="155" width="210" height="65" rx="10"/></g><g stroke="#087c82" stroke-width="3" fill="none"><path d="M220 52 H290"/><path d="M390 85 V187 H550"/><path d="M220 187 H550"/></g><g font-family="Arial" font-size="17" text-anchor="middle" fill="#16364c"><text x="120" y="48">users AS o</text><text x="120" y="70">owner</text><text x="120" y="183">users AS u</text><text x="120" y="205">recipient</text><text x="390" y="60">files AS f</text><text x="655" y="183">file_permissions AS p</text><text x="655" y="205">file_id / user_id</text><text x="255" y="40" font-size="12">owner_id</text><text x="425" y="130" font-size="12">file_id</text><text x="275" y="176" font-size="12">user_id</text></g></svg>`;const quiz=[['מה היתרון המרכזי של JOIN מפורש?',['תמיד מהיר יותר','הפרדת חיבור מסינון','מחזיר פחות שורות'],1,'ON מתאר התאמה ו-WHERE מסנן.'],['8 קבצים ו-15 הרשאות ללא תנאי חיבור: כמה שורות?',['23','15','120'],2,'8 × 15 = 120'],['האם JOIN מפורש תמיד מהיר יותר?',['כן','לא'],1,'SQLite עשוי לבחור אותה תוכנית ביצוע.'],['איזה חיבור שומר קבצים ללא התאמה?',['INNER JOIN','LEFT JOIN','CROSS JOIN'],1,'LEFT JOIN מחזיר גם שורות ללא התאמה, עם NULL.']];const drafts={};function sim(mode){const cross=mode==='cross';$('simout').innerHTML=code(mode==='implicit'?'SELECT f.original_name, p.user_id\nFROM file_permissions AS p, files AS f\nWHERE p.file_id = f.id;':cross?'SELECT f.original_name, p.user_id\nFROM file_permissions AS p, files AS f;':'SELECT f.original_name, p.user_id\nFROM file_permissions AS p\nJOIN files AS f ON p.file_id = f.id;')+'<table><tr><th>permission / file</th>'+files.map(f=>'<th>'+f[0]+'</th>').join('')+'</tr>'+perms.map(p=>'<tr><th>'+p[0]+'</th>'+files.map(f=>'<td class="'+(cross||p[1]===f[0]?'good':'bad')+'">'+p[1]+' = '+f[0]+' '+(cross?'•':p[1]===f[0]?'✓':'×')+'</td>').join('')+'</tr>').join('')+'</table><h2>'+ (cross?9:3)+' שורות בתוצאה</h2>'+table(['original_name','user_id'],perms.flatMap(p=>files.filter(f=>cross||f[0]===p[1]).map(f=>[f[1],p[2]])));document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
function render(){let t=data[index],out='<h1>'+esc(t[0])+'</h1>';if(index===0){out+='<div class="hero"><h2>שתי שיטות כתיבה לחיבור פנימי בין טבלאות</h2><div class="grid"><div class="method"><h2>Explicit JOIN</h2><pre>FROM A <br>JOIN B ON A.id = B.a_id</pre><p>חיבור מפורש: הטבלה ותנאי ההתאמה מוגדרים יחד.</p></div><div class="method"><h2>Implicit JOIN</h2><pre>FROM A, B<br>WHERE A.id = B.a_id</pre><p>חיבור משתמע: הטבלאות בפסיקים והתנאי ב־WHERE.</p></div></div>'+diagram+'<p>נלמד את שתי השיטות באמצעות דוגמה מלווה מעולם כספת הקבצים, נשווה תוצאות ונתרגל כתיבה עצמאית.</p></div>'}else if(index===1){out+=tables()+diagram+'<p>'+esc(t[t.length-1])+'</p>'}else if(index===4){out+=tables()+'<div id="modes"><button data-mode="cross">ללא תנאי</button> <button data-mode="explicit">Explicit JOIN</button> <button data-mode="implicit">Implicit JOIN</button></div><div id="simout"></div><p class="muted">סדר השורות אינו מובטח ללא ORDER BY. זוהי המחשה לוגית, לא תיאור תוכנית הביצוע.</p>'}else if(index===7){out+=code(t.find(x=>x.startsWith('SELECT')))+'<label>מספר קבצים: <output id="nf">10</output><input id="f" type="range" min="1" max="100" value="10"></label><label>מספר הרשאות: <output id="np">12</output><input id="p" type="range" min="1" max="100" value="12"></label><h2 id="product"></h2><p>'+esc(t[t.length-1])+'</p>'}else if(index===12){out+=quiz.map((q,i)=>'<div class="note" style="margin:12px 0"><b>'+esc(q[0])+'</b>'+q[1].map((a,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(a)+'</label>').join('')+'<div id="feedback'+i+'"></div></div>').join('')+'<button class="primary" id="check">בדיקת תשובות</button> <button id="retry">ניסיון חוזר</button><p id="score"></p>'}else{for(const s of t.slice(1)){out+=s.startsWith('SELECT')?code(s):'<p>'+esc(s)+'</p>'}if(index===2||index===3){out+='<h2>תחביר כללי</h2>'+code(index===2?'SELECT A.column, B.column\nFROM A\nJOIN B ON A.id = B.a_id;':'SELECT A.column, B.column\nFROM A, B\nWHERE A.id = B.a_id;')+'<h2>איך השיטה פועלת?</h2>'+methodVisual(index===2)+tables()+'<h2>תוצאה משותפת לשתי השיטות</h2>'+table(['original_name','user_id'],[['photo.jpg',5],['report.pdf',3],['photo.jpg',4]])+'<p class="muted">סדר השורות אינו מובטח ללא ORDER BY.</p>';}if(index===8||index===9)out+=rolesDiagram;if(index===11)out+='<h2>השוואה ישירה</h2><div class="grid"><div><h2>Explicit JOIN</h2>'+code(data[2][3])+'</div><div><h2>Implicit JOIN</h2>'+code(data[3][3])+'</div></div><table class="compare"><tr><th>מאפיין</th><th>Explicit</th><th>Implicit</th></tr><tr><td>תנאי התאמה</td><td>ON</td><td>WHERE</td></tr><tr><td>תנאי סינון</td><td>WHERE</td><td>WHERE</td></tr><tr><td>תוצאה בחיבור פנימי שקול</td><td>זהה</td><td>זהה</td></tr><tr><td>LEFT JOIN ישיר</td><td>כן</td><td>לא</td></tr></table>';if(index===10)out+=tables()+table(['original_name','user_id'],[['report.pdf',3],['photo.jpg',5],['photo.jpg',4],['data.csv','NULL']]);if(index===14||index===16||index===18){out+='<label>כתבו את הפתרון שלכם:</label><textarea id="draft" placeholder="SELECT ...">'+esc(drafts[index]||'')+'</textarea>';if(index!==18)out+='<details><summary>חשיפת פתרון והסבר</summary>'+data[index+1].slice(1).map(s=>s.startsWith('SELECT')?code(s):'<p>'+esc(s)+'</p>').join('')+'</details>';}if(index===14)out+='<p class="muted">התרגיל עוסק בהרשאות שיתוף מפורשות בלבד, לא בזכויות מכוח בעלות.</p>';} $('slide').innerHTML=out;$('count').textContent=(index+1)+' / '+data.length;$('jump').value=index;$('progress').style.width=(index+1)/data.length*100+'%';$('prev').disabled=index===0;$('next').disabled=index===data.length-1;if(index===4)sim('explicit');if(index===7){const calc=()=>{$('nf').value=$('f').value;$('np').value=$('p').value;$('product').textContent='ללא תנאי: '+$('f').value*$('p').value+' שורות | חיבור תקין: '+$('p').value+' שורות';};$('f').oninput=$('p').oninput=calc;calc();}if($('draft'))$('draft').oninput=e=>drafts[index]=e.target.value;window.scrollTo(0,0);}
