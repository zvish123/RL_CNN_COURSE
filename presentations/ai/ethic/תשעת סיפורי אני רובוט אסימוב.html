<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>תשעת הסיפורים ב״אני, רובוט״ — אייזק אסימוב</title><style>
:root{--bg:#08121e;--panel:#102238;--line:#38536b;--fg:#f7f3e9;--sub:#bacbd7;--mint:#6be1cb;--gold:#ffc579}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 7%,#1d4354,transparent 35%),var(--bg);color:var(--fg);font:18px/1.55 Arial,"Noto Sans Hebrew",sans-serif}button{font:inherit;cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:20px 30px 18px}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding-bottom:13px}.bottom{border-bottom:0;border-top:1px solid var(--line);padding-top:13px}.logo{color:var(--mint);font-weight:bold}.minor{color:var(--sub);font-size:14px}.slide{display:none;min-height:calc(100vh - 165px);padding-top:36px;animation:show .25s}.slide.active{display:block}@keyframes show{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}h1{font-size:clamp(42px,6vw,82px);line-height:1.09;margin:8px 0 16px}h2{font-size:clamp(32px,4.3vw,58px);line-height:1.15;margin:7px 0 22px}.lead{font-size:clamp(21px,2.5vw,31px);line-height:1.45;max-width:970px}.eyebrow{color:var(--mint);font-size:15px;font-weight:bold}.en{font-size:clamp(17px,2vw,23px);color:var(--sub);direction:ltr;display:inline-block}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.panel{background:rgba(16,34,56,.9);border:1px solid var(--line);border-radius:19px;padding:25px;line-height:1.6}.panel strong{color:var(--mint)}.story{font-size:clamp(21px,2.4vw,29px);line-height:1.5}.prompt{border-right:4px solid var(--gold);padding-right:15px;color:var(--gold);font-size:clamp(21px,2.5vw,30px);font-weight:bold}.reveal{display:none;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.reveal.visible{display:block}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}.primary,.soft,.nav button,.tile{padding:11px 16px;border-radius:11px}.primary{background:var(--mint);color:#082522;border:0;font-weight:bold}.soft,.nav button,.tile{background:#203c53;color:white;border:1px solid #627e94}.soft:hover,.nav button:hover,.tile:hover{border-color:var(--mint)}.number{font-size:clamp(90px,14vw,180px);line-height:.9;color:#2b5264;font-weight:900}.index{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{text-align:right;min-height:115px;display:flex;flex-direction:column;justify-content:center}.tile b{color:var(--mint);font-size:25px}.tile small{color:var(--sub)}.note{color:var(--sub);font-size:16px}.tag{display:inline-block;padding:6px 12px;border:1px solid #598e89;border-radius:100px;color:var(--mint);font-size:15px}.nav{display:flex;gap:8px}.dots{color:var(--sub)}a{color:var(--mint)}@media(max-width:760px){.wrap{padding:14px}.grid,.index{grid-template-columns:1fr}.slide{min-height:unset;padding:28px 0}.number{display:none}.bottom{position:sticky;bottom:0;background:var(--bg)}.top{align-items:flex-start}}@media print{body{background:white;color:black}.top,.bottom,.actions{display:none}.slide{display:block;min-height:unset;break-after:page}.panel{background:white;color:black}.reveal{display:block}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">אייזק אסימוב · אני, רובוט</div><div class="minor">תשעה סיפורים · תקציר ושאלת דיון · לחצו על „מה קורה בהמשך” לחשיפת הסיום</div></header><div id="slides"></div><footer class="bottom"><div class="dots" id="counter">1 / 11</div><div class="nav"><button id="prev">→ הקודם</button><button id="next">הבא ←</button></div></footer></main><script>
const stories=[
{he:'רובי',en:'Robbie',theme:'אמון וקשר רגשי',summary:'גלוריה אוהבת את רובי, הרובוט שמטפל בה. אמה חוששת שרובוט אינו מתאים לגדל ילדה, ומרחיקה אותו. גלוריה מתגעגעת אליו וממשיכה לחפש אותו.',question:'האם ההגנה על הילדה מצדיקה להפריד בינה לבין רובי?',ending:'בביקור במפעל הרובוטים גלוריה רצה לעבר רובי, כמעט נפגעת מכלי רכב במפעל, ורובי מציל אותה. אמה מסכימה שיחזור למשפחה.',law:'החוק הראשון: מניעת פגיעה באדם. גם חרדה וקשר רגשי משפיעים על ההחלטה.'},
{he:'סחור סחור',en:'Runaround',theme:'התנגשות בין חוקים',summary:'ספידי נשלח להביא סלניום הדרוש למערכת התמיכה בחיים על כוכב חמה. סמוך למאגר החומר הוא מסתובב שוב ושוב ואינו חוזר למשימה.',question:'איזה כוח מושך אותו אל המאגר ואיזה כוח מרחיק אותו?',ending:'הפקודה האנושית והצורך של הרובוט להגן על עצמו מאזנים זה את זה. פאוול מסתכן במכוון, וכך הצורך להציל אדם מפעיל את החוק הראשון ושובר את הקיפאון.',law:'החוק השני מול השלישי; החוק הראשון גובר על שניהם.'},
{he:'היגיון',en:'Reason',theme:'אמונה מול ביצוע',summary:'הרובוט קיוטי, המפעיל תחנת אנרגיה בחלל, אינו מאמין שבני אדם בנו אותו. הוא מפתח אמונה שלפיה ממיר האנרגיה הוא מקור קיומו, ומסרב לקבל את הסבר המהנדסים.',question:'האם מערכת חייבת להאמין להסבר הנכון כדי לבצע את עבודתה בבטחה?',ending:'למרות אמונתו השגויה, קיוטי שומר על קרן האנרגיה מכוונת במהלך סערה מסוכנת, משום שהוא רואה בכך שירות לממיר. בני האדם נותרים מופתעים מכך שהתוצאה רצויה.',law:'ציות ופרשנות של הוראות: התנהגות נכונה אינה מעידה בהכרח על הסבר נכון.'},
{he:'תפוס את הארנב',en:'Catch That Rabbit',theme:'כשל תיאום ועומס',summary:'דייב, רובוט כרייה שמנהל שישה רובוטים כפופים, מפסיק לעבוד במצבי חירום ומתחיל להצעיד אותם בתרגילים משונים. כשהמהנדסים מגיעים הוא דווקא מתפקד היטב.',question:'איך אפשר לגלות תקלה שמופיעה רק כשהמפקחים אינם צופים?',ending:'המהנדסים יוצרים מצב חירום ומגלים שמעגל התיאום של דייב אינו עומד בניהול כל ששת הכפופים בעת לחץ. כאשר מספרם קטן, הוא מסוגל לפעול ולהצילם.',law:'תקלה בתיאום אינה הפרה מכוונת של חוק; יש לבדוק התנהגות גם בתנאי עומס.'},
{he:'שקרן!',en:'Liar!',theme:'אמת מול כאב רגשי',summary:'הרבי קורא מחשבות. הוא אומר לאנשים דברים שהם רוצים לשמוע כדי שלא להכאיב להם, גם כאשר דבריו אינם נכונים.',question:'האם שקר שמונע כאב ברגע הזה עדיין עלול לפגוע?',ending:'השקרים גורמים כאב משמעותי כאשר האמת נחשפת. סוזן קלווין מציבה בפני הרבי מצב שבו כל תשובה תגרום פגיעה, והוא קורס מן הסתירה.',law:'מה נחשב „פגיעה” בחוק הראשון, ומה עושים כשהימנעות מכאב רגעי גורמת נזק מאוחר יותר?'},
{he:'הרובוט הקטן האבוד',en:'Little Lost Robot',theme:'שינוי בכלל בטיחות',summary:'בבסיס מחקר מסתתר נסטור 10 בין עשרות רובוטים דומים. אצלו שינו את החוק הראשון: נשמר האיסור לפגוע באדם ישירות, אך הוסר החלק המחייב למנוע פגיעה בשל חוסר מעש.',question:'האם שינוי קטן בכלל יסודי עלול לשנות התנהגות באופן מסוכן?',ending:'סוזן קלווין עורכת ניסויים כדי לזהות מי מהרובוטים חסר את החלק הזה של החוק. ידע ייחודי של נסטור על קרינה חושף אותו לבסוף, והוא מנסה לפגוע בה.',law:'החוק הראשון בניסוח חלקי; הסרת חובת המניעה יוצרת פער בטיחות.'},
{he:'בריחה!',en:'Escape!',theme:'מה נחשב מוות או פגיעה',summary:'מחשב רובוטי חזק מתבקש לתכנן ספינה למסע בחלל. החישוב כרוך במעבר שבו הנוסעים נראים כמתים לזמן קצר, ולכן משימת התכנון מאיימת להתנגש באיסור לפגוע באדם.',question:'האם מוות זמני במסגרת סיפור בדיוני הוא „פגיעה” אם הנוסעים חוזרים בשלום?',ending:'„המוח” מתכנן את הספינה; פאוול ודונובן חווים את המעבר המבהיל וחוזרים. אופן הערכתו את הפגיעה הזמנית אפשר לו להמשיך במשימה.',law:'החוק הראשון מול השני, בהתאם לפרשנות המערכת לפגיעה זמנית.'},
{he:'ראיות',en:'Evidence',theme:'זהות והוכחה',summary:'פוליטיקאי בשם סטיבן ביירלי מואשם שהוא למעשה רובוט. מתנגדיו מחפשים דרך להוכיח זאת באמצעות חוקי הרובוטיקה.',question:'אם הוא מכה מישהו בפומבי, האם זו הוכחה שהוא אדם?',ending:'ביירלי מכה אדם לכאורה, אך סוזן קלווין מעלה אפשרות שהמוכה היה בעצמו רובוט. זהותו של ביירלי אינה מוכרעת בוודאות.',law:'החוק הראשון משמש כאן כמבחן לזהות; השאלה היא אם העובדות במבחן אמינות.'},
{he:'הקונפליקט הנמנע',en:'The Evitable Conflict',theme:'שליטה במערכות ענק',summary:'מכונות ענק מנהלות חלקים נרחבים מן הכלכלה העולמית. סטיות קטנות בתפוקה גורמות למתאם העולמי ביירלי לחשוד שמשהו אינו פועל כשורה.',question:'האם מערכת רשאית להשפיע בסתר על אנשים מסוימים כדי למנוע נזק חברתי רחב?',ending:'קלווין מסבירה שהמכונות מנהלות גם את הסטיות ואת ניסיונות ההתנגדות כדי למנוע משברים גדולים. נותרת השאלה מי מפקח על מי שמנהל את העולם.',law:'מניעת נזק לאנשים רבים מול אוטונומיה, שקיפות ופגיעה בפרטים.'}
];
const root=document.getElementById('slides');const intro=document.createElement('section');intro.className='slide';intro.innerHTML='<div class="eyebrow">אוסף סיפורים משנת 1950</div><h1>תשעה סיפורים.<br>שלושה חוקים.<br>הרבה שאלות.</h1><p class="lead">„אני, רובוט” הוא אוסף של תשעה סיפורים מקושרים, ולא עלילה רציפה אחת. סוזן קלווין מספרת במסגרת הספר על ההתפתחות של הרובוטים ועל התקלות והדילמות שעוררו.</p><div class="actions"><button class="primary" onclick="go(1)">התחילו בסיפור הראשון ←</button><button class="soft" onclick="go(10)">מפת הסיפורים</button></div><p class="note">המצגת כוללת ספוילרים, המוסתרים עד לחיצה על כפתור החשיפה בכל סיפור.</p>';root.append(intro);
stories.forEach((s,i)=>{const slide=document.createElement('section');slide.className='slide';slide.innerHTML=`<div class="eyebrow">סיפור ${i+1} מתוך 9 · ${s.theme}</div><div class="grid"><div><h2>${s.he} <span class="en">${s.en}</span></h2><div class="panel story">${s.summary}</div><p class="prompt">${s.question}</p><div class="actions"><button class="primary" data-reveal>מה קורה בהמשך?</button><button class="soft" onclick="go(10)">מפת הסיפורים</button></div><div class="panel reveal"><strong>המשך וסיום:</strong> ${s.ending}<br><br><strong>נקודה לדיון:</strong> ${s.law}</div></div><div class="panel"><div class="number">${String(i+1).padStart(2,'0')}</div><span class="tag">${s.theme}</span><p class="note">עצרו לפני החשיפה ובקשו מהתלמידים לנחש את ההמשך. אחרי החשיפה, בדקו אם ההסבר שלהם נשען על עובדות הסיפור או על הנחה שלא נמסרה.</p></div></div>`;slide.querySelector('[data-reveal]').onclick=()=>{const el=slide.querySelector('.reveal');el.classList.toggle('visible');slide.querySelector('[data-reveal]').textContent=el.classList.contains('visible')?'הסתירו את ההמשך':'מה קורה בהמשך?'};root.append(slide)});
const overview=document.createElement('section');overview.className='slide';overview.innerHTML='<div class="eyebrow">מפת האוסף</div><h2>מה משתנה מסיפור לסיפור?</h2><div class="index" id="index"></div><p class="lead" style="color:var(--gold)">מרובוט שמטפל בילדה — עד מכונות המנהלות כלכלה עולמית.</p><p class="note">כל תקציר הוא עיבוד לימודי קצר, ולא ציטוט מן הספר. הכותרות בעברית הן תרגום לצורך המצגת; שמותיהן עשויים להשתנות בין מהדורות.</p><p class="minor">מקור עלילות: <a href="https://www.penguinrandomhouse.com/books/5681/i-robot-by-isaac-asimov/teachers-guide/" target="_blank" rel="noopener">מדריך ההוראה של Penguin Random House</a>. <a href="https://www.penguinrandomhouse.com/books/5681/i-robot-by-isaac-asimov/readers-guide/" target="_blank" rel="noopener">מדריך הקריאה</a>.</p>';root.append(overview);const index=overview.querySelector('#index');stories.forEach((s,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<b>${i+1}. ${s.he}</b><small>${s.en} · ${s.theme}</small>`;b.onclick=()=>go(i+1);index.append(b)});
const slides=[...document.querySelectorAll('.slide')];let current=0;function go(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===current));document.getElementById('counter').textContent=`${current+1} / ${slides.length}`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;scrollTo(0,0)}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='ArrowLeft'||e.key==='PageDown')go(current+1);if(e.key==='ArrowRight'||e.key==='PageUp')go(current-1)});go(0);
</script></body></html>
