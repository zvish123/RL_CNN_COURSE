s('open')){if(e.key==='Escape')overview(false);return}if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();move(1)}if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key.toLowerCase()==='h'&&slides[ix].hint)show('hint');if(e.key.toLowerCase()==='e'&&slides[ix].diagnosis)show('diagnosis');if(e.key.toLowerCase()==='s'&&slides[ix].solution)show('solution')});document.getElementById('ovgrid').innerHTML=slides.map((s,i)=>`<button onclick="jump(${i})"><small>${esc(s.tag)}</small>${i+1}. ${esc(s.title)}</button>`).join('');let n=parseInt(location.hash.slice(1));if(n>=1&&n<=slides.length)ix=n-1;render();</script></body></html>
