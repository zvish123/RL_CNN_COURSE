<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerShell — למידה מטעויות | י״ב סייבר</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Segoe UI",sans-serif;background:#081326;color:#ecf3ff;direction:rtl}body{display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 5vw;background:#0e2139;border-bottom:1px solid #29405d}.brand{font-weight:800;letter-spacing:.3px}.meta{color:#9fb7d0;font-size:14px}.progress{height:5px;background:#223955}.progress>div{height:100%;background:#51d2bc;transition:width .3s}.wrap{width:min(1120px,94vw);margin:24px auto;flex:1}.slide{background:linear-gradient(155deg,#112542,#0b1729);border:1px solid #294463;border-radius:23px;padding:clamp(22px,4vw,48px);min-height:560px;box-shadow:0 15px 60px #0005}.eyebrow{color:#63e0ce;font-size:13px;letter-spacing:1px;font-weight:700}h1{font-size:clamp(29px,4.5vw,52px);margin:12px 0 17px;line-height:1.14}h2{font-size:25px;margin:8px 0 18px}.lead{font-size:clamp(18px,2.5vw,25px);color:#bfcfe4;line-height:1.6;max-width:900px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#0b1a2f;border:1px solid #315071;border-radius:15px;padding:20px;min-width:0}.panel h3{margin:0 0 13px;color:#86d3f6;font-size:17px}.panel p{line-height:1.65;margin:0}.prompt{padding:16px;background:#183857;border-right:5px solid #6dcbbf;border-radius:10px;font-size:20px;font-weight:600;line-height:1.55;margin:18px 0}.code{direction:ltr;text-align:left;unicode-bidi:plaintext;white-space:pre-wrap;overflow:auto;max-height:360px;background:#050d19;border:1px solid #293b52;color:#d8f0ff;padding:18px;border-radius:12px;font:14px/1.6 Consolas,"Courier New",monospace}.reveal{display:none}.reveal.visible{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:.1;transform:translateY(8px)}to{opacity:1;transform:none}}.callout{background:#153d40;border:1px solid #327973;padding:16px;border-radius:12px;margin-top:16px;font-size:17px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{cursor:pointer;border:1px solid #466789;background:#162f4e;color:#e9f6ff;border-radius:11px;padding:11px 18px;font-weight:bold;font-size:15px}.btn.primary{background:#40bfa9;color:#062127;border-color:#40bfa9}.btn:hover{filter:brightness(1.14)}.btn:disabled{opacity:.35;cursor:not-allowed}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 5vw 22px;color:#9fb7d0}.badge{font-size:13px;color:#86d3f6}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.item{background:#102943;border:1px solid #345676;border-radius:12px;padding:18px;font-size:19px}.small{font-size:15px;color:#a5c0d8;margin-top:18px}.reveal .panel{margin-top:15px}.walkthrough{display:grid;gap:10px;margin-top:12px}.walkrow{padding:12px 14px;background:#102944;border:1px solid #2c536d;border-radius:10px;line-height:1.55}.walkrow strong{display:block;color:#75d9cf;direction:ltr;text-align:left;font:600 14px/1.4 Consolas,"Courier New",monospace;margin-bottom:5px}.walkrow span{display:block;color:#e3efff;font-size:16px}.solution-note{border-right:4px solid #61d5c2;padding:11px 14px;background:#133846;margin-top:12px;color:#c7f6eb}.label{display:inline-block;margin-bottom:10px;color:#74d7c7;font-weight:bold}@media(max-width:740px){.row2,.checklist{grid-template-columns:1fr}.slide{min-height:0;padding:22px}.wrap{margin:12px auto}.code{font-size:12px;max-height:300px}.foot{flex-wrap:wrap}}@media print{.top,.foot,.tools,.progress{display:none}.wrap{width:100%;margin:0}.slide{box-shadow:none;border:0;break-after:page;min-height:85vh}.reveal{display:block!important}body{background:white;color:black}.slide{background:white;color:black}.panel{background:#eee;color:black}.code{color:black;background:#f5f5f5}}</style></head><body>
<div class="top"><div class="brand">PowerShell | מעבדת למידה מטעויות</div><div class="meta" id="counter"></div></div><div class="progress"><div id="bar"></div></div><main class="wrap"><div class="slide" id="slide" aria-live="polite"></div></main><div class="foot"><div><button class="btn" onclick="go(-1)" id="prev">◀ הקודם</button> <button class="btn primary" onclick="go(1)" id="next">הבא ▶</button></div><div class="badge">ניווט: מקשי חצים | חשיפת פתרון: לחיצה על הכפתור</div></div>
<script>
const problems=[{"title": "זיהוי בעיה מספר 1", "topic": "נתיבים ותיקיית ההפעלה", "req": "המערכת צריכה לעבוד גם כאשר מריצים את קובץ PowerShell מתיקייה אחרת.", "bad": "$basePath = \".\\Work\\$EmployeeName\"\n$deptSource = \".\\Company\\Templates\\$Department\"", "question": "מה יקרה אם הפקודה מופעלת כאשר המיקום הנוכחי הוא C:\\Temp?", "explain": "הנתיב ‎.\\‎ מחושב לפי תיקיית העבודה הנוכחית ולא לפי התיקייה שבה נמצא קובץ הסקריפט. התיקיות עלולות להיווצר במקום אחר והתבניות לא יימצאו.", "fix": "$root = $PSScriptRoot\n$basePath = Join-Path $root \"Work\\$EmployeeName\"\n$deptSource = Join-Path $root \"Company\\Templates\\$Department\"\n$genSource = Join-Path $root \"Company\\Templates\\General\"\n$serversFile = Join-Path $root \"company_servers.txt\"", "test": "פתח PowerShell מתיקייה אחרת והרץ את הסקריפט בנתיב מלא. ודא שהפלט נוצר לצד הסקריפט ולא בתיקייה הנוכחית.", "take": "נתיבים חייבים להיות יציבים ולא תלויים במיקום שבו עומד המשתמש.", "walkthrough": [["$PSScriptRoot", "משתנה אוטומטי שמכיל את התיקייה שבה נמצא קובץ ה־ps1, ללא תלות בתיקיית העבודה הפעילה."], ["$root", "שומר את מיקום הסקריפט במקום אחד ומקל על שינוי הנתיבים."], ["Join-Path", "מחבר נתיב בסיס ושם תיקייה/קובץ; כל הנתיבים נבנים מאותו מיקום ידוע."], ["$basePath, $deptSource, $genSource, $serversFile", "מפרידים בין נתיב תיקיית העובד, תבניות המחלקה, תבניות כלליות ורשימת שרתים."]]}, {"title": "זיהוי בעיה מספר 2", "topic": "העתקה לעומת ספירת קובצי מקור", "req": "יש להעתיק תבניות למחלקה ולדווח כמה קבצים אכן הועתקו.", "bad": "$deptFiles = (Get-ChildItem $deptSource -Recurse -File | Measure-Object).Count\nCopy-Item \"$deptSource\\*\" $destTemplates -Recurse -Force\nWrite-Host \"Copied $deptFiles files\"", "question": "מה יקרה אם ההעתקה תיכשל, או אם קובץ General ידרוס קובץ מחלקתי בעל אותו שם?", "explain": "הספירה נעשית במקור לפני אימות הצלחת ההעתקה. ‎-Force‎ עשוי לדרוס קובץ ביעד. לכן הדוח עלול להטעות גם אם אין שגיאת תחביר.", "fix": "$copied = 0\nforeach ($file in @(Get-ChildItem $deptSource -Recurse -File)) {\n    $relative = $file.FullName.Substring($deptSource.Length).TrimStart('\\')\n    $target = Join-Path $destTemplates $relative\n    New-Item (Split-Path $target -Parent) -ItemType Directory -Force | Out-Null\n    try {\n        if (Test-Path -LiteralPath $target) { throw \"Target already exists: $target\" }\n        Copy-Item -LiteralPath $file.FullName -Destination $target -ErrorAction Stop\n        if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw \"Missing target: $target\" }\n        $copied++\n    } catch { Write-Log \"ERROR copying $($file.Name): $_\"; $errors++ }\n}", "test": "מחק הרשאת כתיבה מתיקיית יעד לבדיקה (או צור התנגשות שמות). ודא שהדוח אינו מדווח על העתקה מוצלחת.", "take": "מספר קבצי המקור ≠ מספר ההעתקות שהצליחו. יש להגדיר מדיניות לדריסה.", "walkthrough": [["$copied = 0", "מונה של העתקות שהושלמו, במקום ספירת קבצים שנמצאו במקור."], ["Get-ChildItem -Recurse -File", "מאתר את כל קובצי המקור גם בתיקיות משנה; @() מבטיח שאפשר לעבור על אוסף באופן אחיד."], ["Substring(...).TrimStart('\\')", "מחשב נתיב יחסי לקובץ כדי לשמר את מבנה תיקיות המשנה ביעד."], ["Split-Path / New-Item", "מאתר את תיקיית היעד של כל קובץ ויוצר אותה במקרה הצורך."], ["try / throw / catch", "מגדיר מהו כשל ומטפל בו בלי להציג מספר העתקות מטעה."], ["-LiteralPath / -ErrorAction Stop", "מטפל בשמות קבצים כנתיבים מילוליים ומוודא ששגיאת העתקה מפעילה את catch."], ["Test-Path -PathType Leaf", "בודק שנוצר קובץ יעד; לבדיקה מחמירה יותר יש להשוות גם גודל או Hash."], ["$copied++ / $errors++", "מעדכן הצלחות ושגיאות בנפרד, כדי להפיק דוח המשקף את הפעולות בפועל."]]}, {"title": "זיהוי בעיה מספר 3", "topic": "הרצה חוזרת ודוח שרתים", "req": "כל הרצה תפיק דוח קישוריות שמשקף את הבדיקות של אותה הרצה בלבד.", "bad": "foreach ($server in $servers) {\n    Add-Content $reportFile \"[+] $server - Accessible\"\n}", "question": "אם מריצים את התוכנית שלוש פעמים ובכל פעם נבדקים שני שרתים, כמה שורות יהיו בדוח?", "explain": "Add-Content מוסיף שורות ואינו מאפס קובץ קיים. נצברות תוצאות ישנות ומתקבל דוח שאינו מייצג הרצה אחת.", "fix": "$reportFile = Join-Path $logsPath \"connectivity_report.txt\"\nSet-Content -Path $reportFile -Value \"Connectivity $(Get-Date -Format s)\" -Encoding UTF8\nforeach ($server in $servers) {\n    $ok = Test-Connection -ComputerName $server -Count 1 -Quiet -ErrorAction SilentlyContinue\n    Add-Content -Path $reportFile -Value \"$(if ($ok) {'[+]'} else {'[-]'}) $server\" -Encoding UTF8\n}", "test": "הרץ פעמיים עם שני שרתים. ודא שבדוח יש כותרת ושתי תוצאות בלבד, לא ארבע.", "take": "הרצה חוזרת (Idempotency) היא תכונת איכות, לא רק מקרה קצה.", "walkthrough": [["Join-Path $logsPath", "מייצר נתיב לדוח בתיקיית Logs של העובד."], ["Set-Content", "מתחיל דוח חדש בכל הרצה ומחליף את התוצאות שנותרו מהרצה קודמת."], ["Get-Date -Format s", "מוסיף לכותרת תאריך ושעה בפורמט קריא, כך שניתן לזהות מתי בוצעה הבדיקה."], ["Test-Connection -Count 1 -Quiet", "שולח בדיקת ICMP יחידה ומחזיר ערך בוליאני; שרת שאינו מגיב לא בהכרח כבוי."], ["-ErrorAction SilentlyContinue", "מונע הצגת שגיאות לא מסיימות על שרתים לא נגישים בעת הבדיקה."], ["Add-Content", "מוסיף תוצאה אחת לכל שרת לאחר אתחול הדוח. כך אין ערבוב של נתונים ישנים וחדשים."]]}, {"title": "זיהוי בעיה מספר 4", "topic": "דוח הצלחה שגוי", "req": "סטטוס התהליך צריך לשקף חסר בקבצים, העתקות כושלות ותוצאות קישוריות.", "bad": "$status = if ($failedServers.Count -eq 0) {\n    \"SUCCESS\"\n} else { \"COMPLETED WITH WARNINGS\" }", "question": "איזה סטטוס יתקבל אם company_servers.txt חסר ולכן כלל לא נבדקו שרתים?", "explain": "המערך failedServers נשאר ריק כאשר לא התבצעה בדיקה. כך מדווחת הצלחה למרות שהמשימה לא הושלמה.", "fix": "$warnings = 0\n$errors = 0\nif (-not (Test-Path $serversFile -PathType Leaf)) {\n    $warnings++\n    Write-Log \"WARNING: missing server list\"\n}\n# גם היעדר תבניות או כשל העתקה מעדכנים מונים\nif ($errors -gt 0) { $status = \"FAILED\" }\nelseif ($warnings -gt 0 -or $failedServers.Count -gt 0) {\n    $status = \"COMPLETED WITH WARNINGS\"\n} else { $status = \"SUCCESS\" }", "test": "שנה זמנית את שם הקובץ company_servers.txt והרץ. התוצאה חייבת להכיל WARNING ולא SUCCESS.", "take": "אי ביצוע בדיקה אינו שקול לבדיקה שעברה.", "walkthrough": [["$warnings ו־$errors", "שני מונים המתארים בעיות לא קריטיות וכשלים משמעותיים בכל שלבי הריצה."], ["Test-Path ... -PathType Leaf", "בודק שקובץ השרתים באמת קיים כקובץ ולא רק שקיים נתיב בשם זה."], ["$warnings++", "מגדיל את מספר האזהרות כאשר שלב חיוני לא הושלם."], ["Write-Log", "משאיר ראיה מתועדת לכך שבדיקת השרתים דולגה."], ["if / elseif / else", "מגדיר סדר עדיפות חד־משמעי: שגיאות גורמות FAILED; אזהרות או שרתים כושלים גורמים WARNINGS; אחרת SUCCESS."], ["הערת ההשלמה בקוד", "חובה לעדכן את המונים גם בעת כשל העתקה ותבניות חסרות. הקטע מדגים את המנגנון אך אינו תחליף לשילוב בכל שלבי הסקריפט."]]}, {"title": "זיהוי בעיה מספר 5", "topic": "דריסת דוח הסיכום", "req": "יש לשמור תוצאות מכל הרצה כדי שניתן יהיה לחקור ולשחזר אירועים.", "bad": "$reportPath = \"$logsPath\\onboarding_report_$(Get-Date -Format 'yyyyMMdd').txt\"\nSet-Content $reportPath $report", "question": "מה יקרה בהרצה נוספת באותו יום?", "explain": "שם קובץ זהה ו־Set-Content מחליף את התוכן. מאבדים את תוצאת ההרצה הקודמת.", "fix": "$runId = \"$(Get-Date -Format 'yyyyMMdd-HHmmss')_$([guid]::NewGuid().ToString('N').Substring(0,8))\"\n$reportPath = Join-Path $logsPath \"onboarding_report_$runId.txt\"\n$logFile = Join-Path $logsPath \"onboarding_$runId.log\"", "test": "הרץ פעמיים באותה דקה. צריכים להיות שני דוחות ושני לוגים נפרדים.", "take": "מזהה הרצה משותף הופך תחקור לתהליך פשוט.", "walkthrough": [["Get-Date -Format 'yyyyMMdd-HHmmss'", "יוצר רכיב זמן הכולל תאריך ושעה עד רמת השנייה."], ["[guid]::NewGuid()", "מפיק מזהה חדש שמקטין מאוד את הסיכוי להתנגשות בין שתי הרצות באותה שנייה."], ["ToString('N').Substring(0,8)", "מציג שמונה תווים מהמזהה ללא מקפים כדי לשמור על שם קובץ קצר."], ["$runId", "מזהה יחיד המשותף לדוח וללוג של אותה הרצה, כך שניתן להתאים ביניהם."], ["Join-Path", "בונה נתיבים לדוח הסיכום וללוג בלי להסתמך על תיקיית העבודה הפעילה."]]}, {"title": "זיהוי בעיה מספר 6", "topic": "לוגים שאינם מספרים את הסיפור", "req": "יש לשמור בקובץ לוג את הפעולות המרכזיות והאזהרות בזמן ביצוען.", "bad": "foreach ($folder in $folders) {\n    New-Item $folder -ItemType Directory -Force | Out-Null\n}\nWrite-Log \"Created $createdCount folders\"", "question": "אם תיקייה מסוימת לא נוצרה, האם אפשר לדעת מהלוג איזו תיקייה זו?", "explain": "שורת סיכום בלבד לא מספקת נתיב, שלב או הודעת כשל. בחלק מההגשות הפונקציה הוגדרה רק לאחר יצירת התיקיות.", "fix": "function Write-Log {\n    param([string]$Message, [ValidateSet(\"INFO\",\"WARNING\",\"ERROR\")][string]$Level=\"INFO\")\n    $line = \"[$(Get-Date -Format HH:mm:ss)] [$Level] $Message\"\n    Add-Content -Path $logFile -Value $line -Encoding UTF8\n    Write-Host $line\n}\n# יש ליצור את תיקיית Logs לפני הלוג, ולספור יצירה זו\nforeach ($folder in $folders) {\n    try {\n        New-Item -Path $folder -ItemType Directory -Force -ErrorAction Stop | Out-Null\n        Write-Log \"Verified folder: $folder\"\n    } catch { Write-Log \"Folder failure $folder : $_\" \"ERROR\"; $errors++ }\n}", "test": "צור מצב שבו תיקייה אינה ניתנת ליצירה. בדוק האם הלוג מציין את הנתיב ואת פרטי השגיאה.", "take": "לוג שימושי עונה: מה נעשה, מתי, היכן ומה הייתה התוצאה.", "walkthrough": [["function Write-Log / param", "מרכז את הלוגיקה של כתיבת הודעה במקום לשכפל אותה בכל שלב."], ["ValidateSet", "מגביל את רמת ההודעה ל־INFO, WARNING או ERROR, ומונע ערכי רמה לא צפויים."], ["Get-Date", "מוסיף חותמת זמן לכל הודעה."], ["Add-Content וגם Write-Host", "שומר ראיה קבועה בקובץ ובמקביל מציג למפעיל את ההתרחשויות."], ["try / catch", "מתעד גם כישלון ביצירת תיקייה ולא רק פעולות שהצליחו."], ["-ErrorAction Stop", "מבטיח ששגיאת יצירה לא מסיימת תעבור למסלול הטיפול ב־catch."], ["$errors++", "מאפשר לדוח הסופי לציין שנכשל שלב יצירת תיקייה."], ["סדר האתחול", "צריך ליצור את תיקיית Logs לפני כתיבה ללוג ולספור את יצירתה במדויק; אחרת תיווצר ספירה לא נכונה."]]}, {"title": "זיהוי בעיה מספר 7", "topic": "הוראות התקנה והרצה", "req": "אדם אחר צריך להפעיל את העבודה מתוך תיקייה חדשה, בלי לשאול את המפתח.", "bad": "# ההגשה מכילה רק onboard function esc(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

function render(){let out='';let n=page-2;

else out=`<div class="eyebrow">סיכום</div><h1>הגשה מקצועית = קוד + הוכחת תקינות</h1><p class="lead">חשיבה הנדסית אינה מסתיימת בפקודה נכונה. היא כוללת נתיבים יציבים, טיפול בשגיאות, דוחות אמינים, יכולת הרצה חוזרת, README וסביבת בדיקה ניתנת לשחזור.</p><div class="prompt">שאלת יציאה: איזה תיקון אחד הוא החשוב ביותר לאמינות המערכת — ואיך תוכיחו שהוא עובד?</div><div class="callout">דרישה ← זיהוי תקלה ← פתרון ← בדיקה ← הסקת מסקנה</div>`;

function go(d){page=Math.min(total-1,Math.max(0,page+d));render()}function showStage(x){stages[page]=Math.max(stages[page]||0,x);render()}function resetStage(){stages[page]=0;render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(1);if(e.key==='ArrowRight')go(-1)});render();</script></body></html>
